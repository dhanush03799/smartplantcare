<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plant Care System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌱 Smart Plant Care System</h1>
        <p class="subtitle">Check your plant's health using simple environmental values</p>

        <div class="card">

            <label for="temperature">🌡️ Temperature (°C)</label>
            <input type="number" id="temperature" placeholder="Enter temperature">

            <label for="moisture">💧 Soil Moisture (%)</label>
            <input type="number" id="moisture" placeholder="Enter soil moisture">

            <label for="humidity">💦 Humidity (%)</label>
            <input type="number" id="humidity" placeholder="Enter humidity">

            <button onclick="checkPlant()">Check Plant Status</button>

            <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
